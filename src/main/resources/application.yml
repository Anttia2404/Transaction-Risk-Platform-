spring:
  application:
    name: transaction-risk-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/transaction_risk}
    username: ${DB_USERNAME:transaction_risk}
    password: ${DB_PASSWORD:local_dev_only_change_me}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
