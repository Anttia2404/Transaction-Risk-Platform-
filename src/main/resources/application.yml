spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: transaction-risk-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/transaction_risk}
    username: ${DB_USERNAME:transaction_risk}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true

app:
  auth:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:transaction-risk-platform}
      expiry-seconds: ${JWT_EXPIRY_SECONDS:900}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
